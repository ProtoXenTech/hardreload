<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HardReload+</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased select-none">
  <div class="popup-container p-4">
    <!-- Top Header -->
    <header class="flex items-center justify-between pb-3 border-b border-zinc-800">
      <div class="flex items-center gap-2">
        <div class="flex items-center justify-center w-7 h-7 rounded-lg bg-indigo-600 text-white shadow-sm shadow-indigo-500/20">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M12 7v5"/>
            <path d="M9.5 9.5h5"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm font-semibold tracking-tight text-white leading-none">HardReload<span class="text-indigo-400">+</span></h1>
            <span class="text-[10px] font-medium tracking-wider uppercase px-1.5 py-0.5 rounded bg-zinc-800/80 text-zinc-400 border border-zinc-700/50">v1.0</span>
          </div>
          <p class="text-[11px] text-zinc-400 leading-tight mt-0.5">Precision Cache & Storage Buster</p>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button id="btn-open-lab" title="Open Testbench Lab" class="p-1.5 rounded-md text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/60 transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2v7.31"/>
            <path d="M14 9.3V1.99"/>
            <path d="M8.5 2h7"/>
            <path d="M14 9.3a6.5 6.5 0 1 1-4 0"/>
            <path d="M5.52 16h12.96"/>
          </svg>
        </button>
        <button id="btn-open-options" title="Settings & Preferences" class="p-1.5 rounded-md text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/60 transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Active Tab Info Card -->
    <div class="mt-3 p-2.5 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-between">
      <div class="min-w-0 pr-2">
        <div class="flex items-center gap-1.5">
          <span id="tab-protocol-badge" class="px-1.5 py-0.2 rounded text-[10px] font-semibold tracking-wider uppercase bg-emerald-950 text-emerald-400 border border-emerald-800/60">HTTPS</span>
          <span id="tab-domain" class="text-xs font-medium text-zinc-200 truncate">Loading tab...</span>
        </div>
        <div class="flex items-center gap-3 mt-1 text-[11px] text-zinc-400 tabular-nums">
          <span class="flex items-center gap-1">
            <svg class="w-3 h-3 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
            <span id="cookie-stat">0</span> cookies
          </span>
          <span class="flex items-center gap-1">
            <svg class="w-3 h-3 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
            <span id="storage-stat">0</span> items
          </span>
        </div>
      </div>
      <div id="status-indicator" class="flex items-center gap-1 text-[11px] text-zinc-400 bg-zinc-800/60 px-2 py-1 rounded border border-zinc-700/50">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span>Ready</span>
      </div>
    </div>

    <!-- Quick Actions Grid -->
    <div class="mt-3 grid grid-cols-2 gap-2">
      <!-- 1. Hard Reload -->
      <button id="btn-hard-reload" class="action-card group flex flex-col items-start p-3 rounded-lg bg-zinc-900 hover:bg-zinc-800/80 active:scale-[0.98] border border-zinc-800 hover:border-indigo-500/50 transition-all duration-150 text-left">
        <div class="flex items-center justify-between w-full mb-1.5">
          <div class="p-1.5 rounded-md bg-indigo-950/60 text-indigo-400 border border-indigo-800/40 group-hover:bg-indigo-900 group-hover:text-indigo-300 transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
              <path d="M16 21h5v-5"/>
            </svg>
          </div>
          <span class="text-[10px] text-zinc-400 font-mono">Alt+Shift+R</span>
        </div>
        <span class="text-xs font-semibold text-zinc-100 group-hover:text-white">Hard Reload</span>
        <span class="text-[10px] text-zinc-400 leading-tight mt-0.5">Bypass browser cache</span>
      </button>

      <!-- 2. Empty Cache & Reload -->
      <button id="btn-empty-cache" class="action-card group flex flex-col items-start p-3 rounded-lg bg-zinc-900 hover:bg-zinc-800/80 active:scale-[0.98] border border-zinc-800 hover:border-cyan-500/50 transition-all duration-150 text-left">
        <div class="flex items-center justify-between w-full mb-1.5">
          <div class="p-1.5 rounded-md bg-cyan-950/60 text-cyan-400 border border-cyan-800/40 group-hover:bg-cyan-900 group-hover:text-cyan-300 transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              <line x1="10" y1="11" x2="10" y2="17"/>
              <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
          </div>
          <span class="text-[10px] text-zinc-400 font-mono">Alt+Shift+C</span>
        </div>
        <span class="text-xs font-semibold text-zinc-100 group-hover:text-white">Empty Cache</span>
        <span class="text-[10px] text-zinc-400 leading-tight mt-0.5">Flush origin HTTP cache</span>
      </button>

      <!-- 3. Purge Storage -->
      <button id="btn-purge-storage" class="action-card group flex flex-col items-start p-3 rounded-lg bg-zinc-900 hover:bg-zinc-800/80 active:scale-[0.98] border border-zinc-800 hover:border-purple-500/50 transition-all duration-150 text-left">
        <div class="flex items-center justify-between w-full mb-1.5">
          <div class="p-1.5 rounded-md bg-purple-950/60 text-purple-400 border border-purple-800/40 group-hover:bg-purple-900 group-hover:text-purple-300 transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="9" ry="3"/>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
              <line x1="7" y1="12" x2="17" y2="12"/>
            </svg>
          </div>
          <span class="text-[10px] text-zinc-400 font-mono">Alt+Shift+D</span>
        </div>
        <span class="text-xs font-semibold text-zinc-100 group-hover:text-white">Purge Storage</span>
        <span class="text-[10px] text-zinc-400 leading-tight mt-0.5">Wipe Local, IDB & SW</span>
      </button>

      <!-- 4. Clear Cookies -->
      <button id="btn-clear-cookies" class="action-card group flex flex-col items-start p-3 rounded-lg bg-zinc-900 hover:bg-zinc-800/80 active:scale-[0.98] border border-zinc-800 hover:border-amber-500/50 transition-all duration-150 text-left">
        <div class="flex items-center justify-between w-full mb-1.5">
          <div class="p-1.5 rounded-md bg-amber-950/60 text-amber-400 border border-amber-800/40 group-hover:bg-amber-900 group-hover:text-amber-300 transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="8" cy="9" r="1" fill="currentColor"/>
              <circle cx="15" cy="8" r="1.5" fill="currentColor"/>
              <circle cx="10" cy="14" r="1" fill="currentColor"/>
              <circle cx="16" cy="13" r="1" fill="currentColor"/>
            </svg>
          </div>
          <span class="text-[10px] text-zinc-400 font-mono">Domain</span>
        </div>
        <span class="text-xs font-semibold text-zinc-100 group-hover:text-white">Clear Cookies</span>
        <span class="text-[10px] text-zinc-400 leading-tight mt-0.5">Drop domain sessions</span>
      </button>
    </div>

    <!-- 5. Nuclear Purge Action -->
    <button id="btn-nuclear-purge" class="mt-2 w-full group flex items-center justify-between px-3 py-2.5 rounded-lg bg-zinc-900 hover:bg-red-950/40 active:scale-[0.98] border border-zinc-800 hover:border-red-500/50 transition-all duration-150">
      <div class="flex items-center gap-2.5">
        <div class="p-1.5 rounded-md bg-red-950/60 text-red-400 border border-red-800/40 group-hover:bg-red-900 group-hover:text-red-300 transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <div class="text-left">
          <div class="text-xs font-semibold text-zinc-100 group-hover:text-red-200">Nuclear Purge & Reload</div>
          <div class="text-[10px] text-zinc-400 group-hover:text-zinc-300">Total reset: cache + storage + cookies + SW</div>
        </div>
      </div>
      <svg class="w-4 h-4 text-zinc-500 group-hover:text-red-400 group-hover:translate-x-0.5 transition-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <!-- Cache Killer Switch -->
    <div class="mt-3 p-2.5 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-between">
      <div class="pr-2">
        <div class="flex items-center gap-1.5">
          <span class="text-xs font-medium text-zinc-200">Cache Killer Mode</span>
          <span class="text-[9px] px-1 py-0.2 rounded font-mono bg-zinc-800 text-zinc-400 border border-zinc-700/50">Alt+Shift+K</span>
        </div>
        <p class="text-[10px] text-zinc-400 leading-tight mt-0.5">Always inject <code class="text-zinc-300">no-cache</code> for this domain</p>
      </div>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="toggle-cache-killer" class="sr-only peer">
        <div class="w-9 h-5 bg-zinc-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-red-600"></div>
      </label>
    </div>

    <!-- Auto-Reload Section -->
    <div class="mt-3 p-2.5 rounded-lg bg-zinc-900 border border-zinc-800">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span class="text-xs font-medium text-zinc-200">Auto-Reload Loop</span>
        </div>
        <span id="ar-status-text" class="text-[10px] font-mono text-zinc-400">Idle</span>
      </div>

      <div class="flex items-center gap-1.5">
        <div class="grid grid-cols-4 gap-1 flex-1">
          <button class="ar-preset-btn px-2 py-1 text-[11px] font-medium font-mono rounded bg-zinc-800 hover:bg-zinc-750 text-zinc-300 border border-zinc-700/60 active:bg-zinc-700 transition-colors" data-sec="5">5s</button>
          <button class="ar-preset-btn px-2 py-1 text-[11px] font-medium font-mono rounded bg-zinc-800 hover:bg-zinc-750 text-zinc-300 border border-zinc-700/60 active:bg-zinc-700 transition-colors" data-sec="10">10s</button>
          <button class="ar-preset-btn px-2 py-1 text-[11px] font-medium font-mono rounded bg-zinc-800 hover:bg-zinc-750 text-zinc-300 border border-zinc-700/60 active:bg-zinc-700 transition-colors" data-sec="30">30s</button>
          <button class="ar-preset-btn px-2 py-1 text-[11px] font-medium font-mono rounded bg-zinc-800 hover:bg-zinc-750 text-zinc-300 border border-zinc-700/60 active:bg-zinc-700 transition-colors" data-sec="60">60s</button>
        </div>
        <button id="btn-toggle-ar" class="px-3 py-1 rounded text-xs font-medium bg-zinc-800 hover:bg-indigo-600 text-zinc-200 hover:text-white border border-zinc-700/60 hover:border-indigo-500 transition-all">
          Start
        </button>
      </div>
    </div>

    <!-- Feedback Toast in Popup -->
    <div id="popup-toast" class="hidden mt-2 px-2.5 py-1.5 rounded-md bg-emerald-950/80 border border-emerald-800/80 text-emerald-300 text-[11px] flex items-center justify-between">
      <span id="toast-text" class="font-medium">Action executed</span>
      <span class="text-[10px] text-emerald-400 font-mono">OK</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
